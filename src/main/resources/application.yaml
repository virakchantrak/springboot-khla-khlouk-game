spring:
  application:
    name: KhlaKhlouk

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/khla-khlouk-game}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour