services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: khla_khlouk
      POSTGRES_USER: khla
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khla -d khla_khlouk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/khla_khlouk
      DB_USERNAME: khla
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_REGISTRATION_MAX_PER_IP_PER_HOUR: ${APP_REGISTRATION_MAX_PER_IP_PER_HOUR:-5}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data: